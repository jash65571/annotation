[project]
name = "manuscript-reviewer"
version = "0.1.0"
description = "Frame-accurate Manuscript II review and evidence engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    # Tested against opencv-python-headless 5.0.0.93 and numpy 2.5.2 (see
    # uv.lock); bounds reflect tested compatibility, not aspiration.
    "opencv-python-headless>=4.10,<6",
    "numpy>=1.26,<3",
]

[project.scripts]
manuscript-reviewer = "manuscript_reviewer.cli:app"

[project.optional-dependencies]
autoscribe = [
    "scenedetect>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pyinstaller==6.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/manuscript_reviewer"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["engine", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "C4"]
ignore = [
    "SIM108",  # ternary is not always clearer
    "RUF012",  # Pydantic v2 handles mutable field defaults safely (deep-copies them)
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "engine"
packages = ["manuscript_reviewer"]
warn_unreachable = true
# ASR worker scripts run inside their own isolated uv environments whose
# dependencies (faster_whisper, whisperx, torch) are never installed in the
# core environment — they cannot be type-checked here.
exclude = "audio/asr/workers/"
# PyYAML ships stubs via types-pyyaml
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not asr_integration'"
markers = [
    "asr_integration: requires local ASR worker environments and models (run with -m asr_integration)",
]
