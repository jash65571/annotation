[package]
name = "manuscript-reviewer-cockpit"
version = "0.1.0"
description = "Reviewer Cockpit: local desktop UI for the Manuscript Reviewer engine"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "manuscript_reviewer_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
