name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg (PINNED static build with libx264)
        # Pinned to a fixed BtbN autobuild tag + fixed FFmpeg 8.1.2 asset so CI
        # never floats on "latest master". Local dev is tested against FFmpeg
        # 9.0 (gyan.dev essentials, Windows); builds differ but both are
        # modern-generation FFmpeg. Do not change this pin casually — fixture
        # behavior is validated against it.
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-11-13-11/ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-gpl-8.1.tar.xz
          mkdir -p /tmp/ffmpeg
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          sudo cp /tmp/ffmpeg/bin/ffmpeg /tmp/ffmpeg/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy
