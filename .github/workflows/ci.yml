name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg (PINNED static build with libx264)
        # Pinned to a fixed BtbN autobuild tag + fixed FFmpeg 8.1.2 asset so CI
        # never floats on "latest master". Local dev is tested against FFmpeg
        # 9.0 (gyan.dev essentials, Windows); builds differ but both are
        # modern-generation FFmpeg. Do not change this pin casually — fixture
        # behavior is validated against it.
        run: |
          # Retry transient GitHub 5xx / network errors on the PINNED asset so a
          # flaky download never fails CI. --retry-all-errors is required because
          # plain --retry does not retry a 503 returned on the first response.
          # No apt fallback: that would silently change fixture behaviour.
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-11-13-11/ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-gpl-8.1.tar.xz
          mkdir -p /tmp/ffmpeg
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          sudo cp /tmp/ffmpeg/bin/ffmpeg /tmp/ffmpeg/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm test
      - name: Build
        run: npx vite build

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # tauri-build needs the frontendDist directory to exist at compile time.
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p ../dist && touch ../dist/index.html
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (warnings denied)
        run: cargo clippy -- -D warnings
      - name: Rust tests
        run: cargo test

  tauri-build:
    runs-on: windows-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Tauri Windows build (no bundle)
        working-directory: desktop
        run: npm run tauri build -- --no-bundle
