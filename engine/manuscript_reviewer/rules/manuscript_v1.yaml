# Manuscript II rule set, version 1.3.
#
# NOTE (Phase 3.1 finalization, 2026-08-12): the four named controlling
# documents (FRAME-AUDIT, PROJ-RULES, AUDIT-RM, CUR-SRC) are now supplied locally
# and have been read in full. Provenance below has been re-mapped from TASK-FEED
# to the actual controlling source wherever one directly supports the rule;
# TASK-FEED is retained only for genuinely task-/engine-specific requirements not
# present in the controlling documents.
#
# Every rule carries provenance: which reference document it came from.
# Raw source documents are NOT committed to the repository (distribution
# rights unclear) — they live locally under ./references/ and must be
# supplied separately; see references/README.md. Only these derived rules
# and source metadata are committed.
#
# Sources (exact local filenames; two carry download-artifact "(n)" suffixes):
#   MASTER-REF  = manuscript-ii-master-reference.md (Master Reference, compiled from Learning Hub)
#   HANDBOOK    = MANUSCRIPT-II-REVIEWER-HANDBOOK-v1.2 (1).md (Reviewer Handbook v1.2)
#   GOLDEN-PDF  = Manuscript II.pdf (31-page Golden Examples export, 2026-08-10)
#   FRAME-AUDIT = MANUSCRIPT-II-MASTER-FRAME-AUDIT-PROTOCOL-v1.5(4).txt (Master Frame Audit Protocol v1.5)
#   PROJ-RULES  = MANUSCRIPT-II-PROJECT-RULES-CURRENT.md (Standing Project Memory Rules)
#   AUDIT-RM    = MANUSCRIPT_AUDIT_README-v3.2(2).md (Audit Pipeline v3.2 README)
#   CUR-SRC     = MANUSCRIPT-II-CURRENT-SOURCES.md (Current Project Sources index)
#   TASK-FEED   = current task-/engine-specific workflow feedback (Phase 2.1/3
#                 directives, 2026-08-12) — highest-priority source tier; used
#                 only where no controlling document states the requirement.
#   AUDIT-NOTES = completed-task audit notes d97b1fc6c006_2.0_18.0_full_audit_notes.md
#                 (local working artifact; §5 documents the approved local audio
#                 workflow: FFmpeg -> faster-whisper large-v3-turbo -> WhisperX
#                 forced alignment, isolated uv bootstrap, no cloud/Descript
#                 fallback, waveform/spectrogram/10ms-RMS fallback evidence).
#   QC-REPORT   = completed-task final QC report 57d9271027f3 (local working
#                 artifact; confirms no-Descript/no-cloud rule and transcripts
#                 as wording leads, not frame evidence).
#
# Conflict policy (docs/01-rule-hierarchy.md): newest live-tool rule wins over
# older example syntax. Conflicts are recorded under `known_conflicts`.

rules_version: "1.3.0"
sources:
  - id: MASTER-REF
    file: references/manuscript-ii-master-reference.md
    supplied_locally: true
  - id: HANDBOOK
    file: "references/MANUSCRIPT-II-REVIEWER-HANDBOOK-v1.2 (1).md"
    supplied_locally: true
  - id: GOLDEN-PDF
    file: "references/Manuscript II.pdf"
    supplied_locally: true
  - id: FRAME-AUDIT
    file: "references/MANUSCRIPT-II-MASTER-FRAME-AUDIT-PROTOCOL-v1.5(4).txt"
    supplied_locally: true
  - id: PROJ-RULES
    file: references/MANUSCRIPT-II-PROJECT-RULES-CURRENT.md
    supplied_locally: true
  - id: AUDIT-RM
    file: "references/MANUSCRIPT_AUDIT_README-v3.2(2).md"
    supplied_locally: true
  - id: CUR-SRC
    file: references/MANUSCRIPT-II-CURRENT-SOURCES.md
    supplied_locally: true
  - id: TASK-FEED
    file: null
    supplied_locally: true

timing:
  # MASTER-REF §1/§5, HANDBOOK §20 Rule 1: graded literally at 0.1 s.
  timestamp_precision_seconds: 0.1
  # HANDBOOK §20 Rule 2, MASTER-REF check 16: timestamps precede descriptions.
  timestamps_before_description: true
  # MASTER-REF §8, HANDBOOK §20 Rule 3: entries must fall inside the shot window.
  timestamp_inside_shot_window: true
  # MASTER-REF §8, HANDBOOK §20 Rule 4: no duplicated full start/end pair per shot.
  action_audio_unique_full_window: true
  # HANDBOOK §20 Rule 4: sharing only a start OR only an end is allowed.
  shared_single_endpoint_allowed: true
  # MASTER-REF §5, HANDBOOK §17: split speech at pauses longer than 0.5 s.
  speech_pause_split_seconds: 0.5
  # MASTER-REF §5, HANDBOOK §20 Rule 5 / §17: overlap is allowed and often required.
  overlapping_entries_allowed: true
  overlapping_speech_separate_entries: true
  # HANDBOOK §20 Rule 6: never force "nice" round ranges.
  forced_round_timestamps_forbidden: true
  # GOLDEN-PDF p.17: an entry may be as short as 0.1 s (7.3s-7.4s hand release).
  minimum_entry_duration_seconds: 0.1

characters:
  # HANDBOOK §21 (current critical rule), MASTER-REF §8 tool validation.
  no_pronouns_outside_dialogue: true
  pronoun_blocklist: [he, she, they, his, her, him, them]
  # MASTER-REF §4: C1, C2... in order of appearance; O1, O2... for prominent objects.
  character_id_prefix: "C"
  object_id_prefix: "O"
  ids_in_order_of_appearance: true
  # MASTER-REF §4: once defined, refer by ID only.
  reference_by_id_after_definition: true
  # MASTER-REF §4, HANDBOOK §6: off-screen voices are characters with C-IDs.
  off_screen_voices_are_characters: true
  # MASTER-REF check 2, HANDBOOK §6: the filmer gets a normal C-ID when relevant.
  cameraman_is_normal_character: true
  # MASTER-REF §4: literal sentence when lower body never visible.
  lower_body_not_visible_sentence: "Lower body and shoes are not visible."
  # MASTER-REF check 1, HANDBOOK check 1: no ghost C#/O# entries.
  ghost_ids_forbidden: true
  # MASTER-REF check 6, HANDBOOK check 6: omit uncertain profile traits, never hedge.
  uncertain_traits_omitted_not_hedged: true

positioning:
  # HANDBOOK §22: use screen-left / screen-right for image positions.
  screen_relative_directions: [screen-left, screen-right]
  bare_left_right_discouraged: true

fields:
  # MASTER-REF §13 known inconsistencies, HANDBOOK §36: live tool combines
  # Movements + Audio into Action & Audio. Follow the tool.
  action_audio_combined_field: true
  one_sentence_per_action_audio_line: true          # MASTER-REF §8 tool validation
  # HANDBOOK §15/§27: camera movement lives in Camera Movements only.
  camera_movement_allowed_in_action_audio: false
  camera_movements_optional_when_static: true       # MASTER-REF §8
  # HANDBOOK §8: Scene holds stable state only; dynamic action goes elsewhere.
  dynamic_action_allowed_in_scene: false
  # MASTER-REF §4: speech never goes in Overview Audio.
  speech_in_overview_audio_forbidden: true
  # HANDBOOK §11/§12: concerns fields describe real defects, else exactly "None."
  concerns_none_literal: "None."
  reviewer_notes_in_caption_forbidden: true         # HANDBOOK §27
  # MASTER-REF §8: on-screen text is its own timestamped line, text quoted.
  on_screen_text_timestamped: true

audio:
  # HANDBOOK §18, MASTER-REF check 9: no empty-audio filler entries.
  empty_audio_fillers_forbidden:
    - "No speech"
    - "No dialogue"
    - "No music"
    - "No ambient sound"
    - "[no audio]"
  # MASTER-REF check 4 + §13, HANDBOOK §36: [inaudible] is the current token;
  # <unintelligible> is the older style and must not be produced.
  inaudible_token: "[inaudible]"
  deprecated_inaudible_tokens: ["<unintelligible>"]
  never_guess_speech: true                          # MASTER-REF check 4
  transcribe_verbatim: true                         # MASTER-REF §4, HANDBOOK §17
  preserve_stutters_and_cutoffs: true               # MASTER-REF §4, GOLDEN-PDF p.25
  attribute_speech_to_character_id: true            # MASTER-REF check 8
  off_screen_speech_marked: true                    # MASTER-REF §4
  vocal_profile_when_clear: true                    # MASTER-REF check 10
  genuine_silence_goes_to_audio_concerns: true      # MASTER-REF check 9
  ambient_audio_must_be_captioned: true             # MASTER-REF §4, HANDBOOK §18

shots:
  # MASTER-REF §6: Shot 1 is always Opening shot, never elsewhere.
  shot_one_transition: "Opening shot"
  opening_shot_only_first: true
  # MASTER-REF §6 (fixed menu), HANDBOOK §14.
  allowed_transition_types:
    - Opening shot
    - Hard cut
    - Cross dissolve
    - Fade in
    - Fade out
    - Match cut
    - Jump cut
    - Smash cut
    - Wipe
    - Iris
    - L-cut
    - J-cut
    - Whip pan
    - Swish pan
  # Phase 3.1 (§22): there is NO automatic caption-facing transition default.
  # "Hard cut" is statistically common but is NOT factual truth when the
  # evidence is unresolved, and a later caption builder must never emit it merely
  # because a transition could not be resolved. The shot engine already selects
  # transitions from frame evidence and leaves unresolved ones UNRESOLVED.
  default_transition: null
  unresolved_transition_is_not_hard_cut: true
  # MASTER-REF check 11, HANDBOOK §14: a flash frame can be its own shot; verify frames.
  flash_frames_require_frame_review: true
  # MASTER-REF check 12, HANDBOOK check 12: fade content belongs to outgoing shot.
  fade_frames_belong_to_outgoing_shot: true
  # GOLDEN-PDF pp.16-30, HANDBOOK §28C: camera movement never creates a shot.
  camera_movement_is_not_a_cut: true
  # MASTER-REF §8: very short shots (0.4 s) can still be real shots.
  minimum_real_shot_duration_seconds: null

playback_speed:
  # MASTER-REF §4, HANDBOOK §23. UI labels may differ; use the tool's options.
  allowed_values: [slow_motion, regular, accelerated]
  per_shot_required: true
  mid_shot_speed_changes_timestamped: true
  fast_motion_is_not_accelerated_playback: true     # HANDBOOK §23
  motion_blur_is_not_slow_motion: true              # HANDBOOK §23

source_hierarchy:
  # PROJ-RULES "Mandatory source order", FRAME-AUDIT §0 priority list, CUR-SRC:
  # newest official/task-specific workflow material outranks all older documents;
  # actual media is factual truth beneath it.
  newest_official_workflow_outranks_older: true      # PROJ-RULES; FRAME-AUDIT §0
  actual_media_is_factual_truth: true                # FRAME-AUDIT §1; PROJ-RULES
  golden_examples_are_floor_not_ceiling: true        # HANDBOOK §1A; PROJ-RULES; FRAME-AUDIT §0A

action_audio_atomicity:
  # FRAME-AUDIT §30D.1 / §30E-B, PROJ-RULES "Action & Audio atomicity",
  # AUDIT-RM "Action & Audio must be atomic": strict Action & Audio atomicity.
  strict_atomicity: true                             # FRAME-AUDIT §30D.1; PROJ-RULES; AUDIT-RM
  # One line = one independently defensible event/source, unless truly inseparable.
  one_line_one_defensible_event: true                # FRAME-AUDIT §24/§30D.1; PROJ-RULES
  # No hidden second action smuggled behind "and", "then", "while", "as".
  hidden_second_action_forbidden: true               # FRAME-AUDIT §30D.4/§30E-B.4; PROJ-RULES
  hidden_action_connectives: ["and", "then", "while", "as"]  # FRAME-AUDIT §30D.4; PROJ-RULES
  # No multiple separate speech acts in one line.
  multiple_speech_acts_per_line_forbidden: true      # FRAME-AUDIT §30E-C; PROJ-RULES
  # No visual action combined with a separate popup/sound/object event.
  mixed_event_sources_per_line_forbidden: true       # FRAME-AUDIT §30D.1/§30E-B.5; PROJ-RULES

timing_integrity:
  # FRAME-AUDIT §22 "Do not create fake offsets" / §30D.3 "NEVER FIX THIS WITH
  # ARBITRARY 0.1-SECOND NUDGES", PROJ-RULES "no fake timestamp nudges".
  fake_timestamp_nudges_forbidden: true              # FRAME-AUDIT §22/§30D.3; PROJ-RULES
  # FRAME-AUDIT §30A.10: check the final physical state of every important object.
  final_object_state_check_required: true            # FRAME-AUDIT §30A.10
  # FRAME-AUDIT §3 requires the "correct annotation endpoint" as a distinct value
  # (not container/final-frame duration) and §27 final QC checks a wrong endpoint;
  # the "permanent failure class" framing is TASK-FEED engine policy.
  incorrect_annotation_endpoint_is_permanent_failure: true  # FRAME-AUDIT §3/§27; TASK-FEED
  annotation_endpoint_from_media_evidence: true      # FRAME-AUDIT §1/§3

validation_scope:
  # AUDIT-RM "a machine validator is not the full review", FRAME-AUDIT §30E-D
  # "a local '0 errors' result is NOT enough", PROJ-RULES/CUR-SRC "run both static
  # validation and the manual platform-semantic pass": the machine validator is a
  # pre-check, not the submit gate.
  machine_validator_replaces_platform_validation: false  # AUDIT-RM; FRAME-AUDIT §30E-D; PROJ-RULES; CUR-SRC

audio_tooling:
  # FRAME-AUDIT §0C "HARD DESCRIPT RULE" / §30B.10, PROJ-RULES "Descript rule",
  # AUDIT-RM, CUR-SRC "Descript is disabled by default": Descript off by default;
  # a local ASR failure never authorizes a cloud or Descript fallback.
  descript_enabled: false                            # FRAME-AUDIT §0C/§30B.10; PROJ-RULES; AUDIT-RM; CUR-SRC
  local_asr_failure_authorizes_cloud_fallback: false # FRAME-AUDIT §0C/§30B.12; PROJ-RULES; AUDIT-RM
  local_asr_failure_authorizes_descript_fallback: false  # FRAME-AUDIT §0C/§30B.10; PROJ-RULES; AUDIT-RM
  # FRAME-AUDIT §18 "transcription may be used only as a lead, never as truth" /
  # §30B.4 "AUTOMATIC SPEECH IS NEVER FINAL TRUTH", AUDIT-RM "ASR is evidence only".
  asr_is_evidence_only: true                         # FRAME-AUDIT §18/§30B.4; AUDIT-RM; PROJ-RULES
  # FRAME-AUDIT §0C "The audit must continue" / §30B.12, AUDIT-RM "records the ASR
  # failure and continues": the full audit continues after a local ASR failure.
  full_audit_continues_after_asr_failure: true       # FRAME-AUDIT §0C/§30B.12; AUDIT-RM
  # FRAME-AUDIT §30B, AUDIT-RM, PROJ-RULES: the approved local audio workflow.
  approved_workflow: "ffmpeg -> faster-whisper -> whisperx-forced-alignment"  # FRAME-AUDIT §30B; AUDIT-RM; PROJ-RULES
  default_asr_model: "large-v3-turbo"                # FRAME-AUDIT §30B.9; AUDIT-RM
  # Transcription workflow: FRAME-AUDIT §30B/AUDIT-RM. The explicit never-translate
  # engine flag (task="transcribe") is not stated in the docs → TASK-FEED policy.
  asr_task: "transcribe"                             # FRAME-AUDIT §30B (transcription); TASK-FEED (never translate)
  asr_isolation: "uv-bootstrap"                      # FRAME-AUDIT §30B.8; AUDIT-RM

review:
  # HANDBOOK §1: the three valid reviewer outcomes.
  outcomes: [KEEP, FIX_ENRICH, REDO_REBUILD]
  # HANDBOOK §1/§33: media is factual truth; seed is a hypothesis.
  media_over_seed: true
  # HANDBOOK §26: Final Review suggestions are leads, never commands.
  suggestions_are_leads_not_commands: true
  # HANDBOOK §5 step 3A: do not patch a bad foundation.
  rebuild_over_patch_when_seed_unreliable: true
  # MASTER-REF §1: the two laws.
  no_omissions: true
  no_hallucinations: true
  # HANDBOOK §1A: Golden Examples are the floor, not the ceiling.
  golden_examples_are_quality_floor: true
  # MASTER-REF §3: wrong-video caption is an auto-reject; check video id first.
  video_id_sanity_check_required: true

known_conflicts:
  - id: CONFLICT-001
    topic: inaudible token
    older: "<unintelligible> (reference caption style)"
    newer: "[inaudible] (Additional Checks / current spec convention)"
    winner: "[inaudible]"
    provenance: "MASTER-REF §13, HANDBOOK §36"
  - id: CONFLICT-002
    topic: field layout
    older: "separate Movements + Audio fields (assessment wedding example)"
    newer: "combined Action & Audio, one line per sentence (live tool)"
    winner: "Action & Audio"
    provenance: "MASTER-REF §13, HANDBOOK §36"
  - id: CONFLICT-003
    topic: pronouns
    older: "Golden Examples contain pronouns (e.g. 'his right hand', GOLDEN-PDF p.23)"
    newer: "no pronouns outside quoted dialogue (live-tool flag)"
    winner: "no pronouns outside quoted dialogue"
    provenance: "MASTER-REF §8, HANDBOOK §21/§36"
  - id: CONFLICT-004
    topic: playback speed labels
    older: "docs show slow_motion / regular / accelerated"
    newer: "UI may display human-readable labels"
    winner: "exact option offered by the current tool"
    provenance: "HANDBOOK §36"
  - id: CONFLICT-005
    topic: default transition selection
    older: >-
      MASTER-REF §6 / HANDBOOK §14 call Hard cut "the overwhelming default —
      when in doubt, it's a hard cut" (a statistical prior).
    newer: >-
      FRAME-AUDIT §12/§13 "classify only after verification / only create a
      boundary when the sequence proves an edit", §30A.1 "map the transition to
      how the new shot actually enters; never invent an unavailable label", and
      MASTER-REF check 11 / HANDBOOK check 11 "do not auto-label all transitions
      Hard cut" require evidence-first selection.
    winner: >-
      No automatic Hard-cut default. Hard cut stays a valid menu option but is
      never emitted merely because a transition is unresolved; unresolved
      transitions stay UNRESOLVED (rules v1.3.0 default_transition: null,
      unresolved_transition_is_not_hard_cut). Confirms the Phase 3.1 §22 change.
    provenance: "FRAME-AUDIT §12/§13/§30A.1; MASTER-REF check 11; HANDBOOK check 11/§14"
